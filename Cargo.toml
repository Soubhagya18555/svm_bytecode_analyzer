[package]
name = "svm_bytecode_analyzer"
version = "0.1.0"
edition = "2021"
authors = ["Soubhagya"]
description = "SBF/BPF bytecode disassembler and control flow analyzer for Solana programs"
license = "MIT"
readme = "README.md"

[[bin]]
name = "svm_bytecode_analyzer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
